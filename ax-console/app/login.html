<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>AX 발행 콘솔 로그인</title>
<style>
@font-face{font-family:P;src:url(/fonts/pretendard.otf);font-weight:700}
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202b;--sub:#5f6b78;--line:#e2e6eb;--acc:#2563eb;--warn:#c2410c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1318;--card:#172029;--ink:#e6edf3;--sub:#93a1b0;--line:#283441;--warn:#fb923c}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:700 15px/1.5 P,-apple-system,sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-size:22px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--sub);font-size:13px;margin:0 0 18px}
label{display:block;color:var(--sub);font-size:12px;margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
button{width:100%;margin-top:18px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;cursor:pointer}
button:disabled{opacity:.6}.msg{color:var(--warn);font-size:13px;margin-top:10px;min-height:1.2em}.hint{margin-top:16px;font-size:12px;color:var(--sub)}
</style></head><body>
<form class="card" id="f" onsubmit="go(event)">
  <div class="logo">AX</div>
  <h1 id="h">AX 발행 콘솔</h1>
  <p id="sub">불러오는 중…</p>
  <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div id="cf" hidden><label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password"></div>
  <button id="btn">로그인</button>
  <div class="msg" id="msg"></div>
  <div class="hint" id="hint"></div>
</form>
<script>
let setup=false;
const $=id=>document.getElementById(id);
fetch('/api/auth/status').then(r=>r.json()).then(s=>{
  if(s.logged_in){location.href='/';return}
  setup=!s.setup;
  if(setup){$('h').textContent='콘솔 비밀번호 만들기';$('sub').textContent='처음 한 번 콘솔 비밀번호를 정합니다(8자 이상). 이 Mac 에만 해시로 저장됩니다.';
    $('cf').hidden=false;$('pw').autocomplete='new-password';$('btn').textContent='만들고 시작하기'}
  else{$('sub').textContent='콘솔 비밀번호를 입력하세요.'}
  $('hint').textContent='비밀번호를 잊으면 이 Mac 에서 ax-console/data/auth/auth.json 을 지운 뒤 다시 만듭니다.'});
async function go(e){e.preventDefault();$('msg').textContent='';
  const pw=$('pw').value;
  if(setup&&pw!==$('pw2').value){$('msg').textContent='두 비밀번호가 다릅니다';return}
  $('btn').disabled=true;
  const r=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  const j=await r.json().catch(()=>({}));$('btn').disabled=false;
  if(r.ok){location.href='/'}else{$('msg').textContent=j.error||'로그인하지 못했습니다';$('pw').select()}}
</script></body></html>
