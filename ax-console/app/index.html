<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>AX 발행 콘솔</title>
<style>
@font-face{font-family:P;src:url(/fonts/pretendard.otf);font-weight:700}
:root{--bg:#f3f5f8;--card:#fff;--ink:#16202b;--sub:#5f6b78;--line:#e2e6eb;--acc:#2563eb;--warn:#c2410c;--ok:#15803d;--run:#a16207}
:root[data-acc=personal]{--acc:#7c3aed}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1318;--card:#172029;--ink:#e6edf3;--sub:#93a1b0;--line:#283441;--warn:#fb923c;--ok:#4ade80;--run:#facc15}}
[hidden]{display:none!important}
.dd{position:relative;display:inline-block}.ddm{display:none;position:absolute;right:0;top:calc(100% + 4px);min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:4px;z-index:50}
.dd.open .ddm{display:block}.ddm a{display:block;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap}.ddm a:hover{background:var(--bg)}.ddm a.bad{color:var(--warn)}.ddm .sep{border-top:1px solid var(--line);margin:4px 0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:700 14px/1.5 P,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}header .who{color:var(--sub);font-size:13px;margin-left:auto}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:3px}.seg button{border:0;background:none;color:var(--sub);font:inherit;padding:6px 16px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.wrap{display:grid;grid-template-columns:210px 1fr 400px;gap:16px;padding:16px 20px;align-items:start}
@media(max-width:1100px){.wrap{grid-template-columns:200px 1fr}.wrap>.edit{grid-column:1/-1}}
@media(max-width:700px){.wrap{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:14px;color:var(--sub);margin:0 0 10px}
.ch{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer}
.ch small{display:block;color:var(--sub);font-size:11px}.ch.on{background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}
.ch.off{color:var(--sub)}.n{background:var(--bg);border-radius:9px;padding:0 8px;font-size:12px;color:var(--sub)}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 10px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.task:first-of-type{border-top:0}.task.on{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.task .t{font-size:15px}.task .m{color:var(--sub);font-size:12px}
.st{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--bg);color:var(--sub);white-space:nowrap;align-self:start}
.st.scheduled{color:var(--acc)}.st.done{color:var(--ok)}.st.failed{color:var(--warn)}.st.running{color:var(--run)}
.empty{color:var(--sub);padding:20px 4px}
label{display:block;color:var(--sub);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:140px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btns button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;border-radius:8px;padding:8px 12px;cursor:pointer}
.btns .pri{background:var(--acc);border-color:var(--acc);color:#fff}.btns .del{color:var(--warn);margin-left:auto}
.live{color:var(--warn);font-size:12px;margin-top:6px}
.runs{margin-top:16px}.run{border-top:1px solid var(--line);padding:8px 0;font-size:12px}
.run b{color:var(--ok)}.run b.x{color:var(--warn)}.run a{color:var(--acc);cursor:pointer;margin-left:6px}
pre{background:var(--bg);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:260px;overflow:auto}
.top2{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.newbtn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.msg{color:var(--warn);font-size:13px;margin-top:8px;min-height:1em}

#autov{padding:16px 20px;max-width:1200px}
#contv{padding:16px 20px}.pipe{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.pipe span{font-size:12px;border-radius:6px;padding:3px 9px;background:var(--bg);color:var(--sub)}.pipe span.on{background:var(--acc);color:#fff}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}@media(max-width:900px){.board{grid-template-columns:1fr 1fr}}
.col h3{font-size:13px;color:var(--sub);margin:0 0 8px}.cc{background:var(--card);border:1px solid var(--line);border-left:4px solid #2563eb;border-radius:9px;padding:9px;margin-bottom:8px;cursor:pointer;font-size:13px}.cc.p{border-left-color:#7c3aed}.cc.on{outline:2px solid var(--acc)}
.cc .mut{font-size:11px}.ed{margin-top:16px}.vt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}.vt button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}.vt button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chk label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px;margin:5px 0}.chk input{width:auto}.warn{color:var(--warn);font-size:13px}.agrp{margin-bottom:16px}.agrp>h2{color:var(--ink);font-size:17px}
.chrow{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.chrow:first-of-type{border-top:0}
.job{padding:6px 0}.job b{font-size:14px}.job .mut{font-size:12px}.role{font-size:11px;border-radius:5px;padding:0 6px;margin-left:6px;background:var(--bg);color:var(--sub)}.role.m{color:var(--acc)}.off{color:var(--warn);font-size:11px;margin-left:6px}
.jbtn{display:flex;gap:6px;margin-top:4px}.jbtn button{font:inherit;font-size:12px;padding:2px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}.jbtn button:disabled{opacity:.5;cursor:default}
.autobox{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
#schv,#acctv{padding:16px 20px;max-width:1100px}
.gcard{border-top:5px solid #2563eb}.gcard.p{border-top-color:#7c3aed}.svc{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.svc .tg{font-size:13px}.svc .mut{overflow-wrap:anywhere;font-size:10px}.svc .tg div{padding:1px 0}.gbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12px;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.lg{font-size:12px;margin-top:4px}.day{margin:16px 0 6px;font-size:15px}.src{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--bg);color:var(--sub)}.src.c{color:var(--acc)}.acct{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;margin-right:6px}.acct.p{background:#7c3aed}.filt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filt select{width:auto}tr.click{cursor:pointer}
#setv{padding:16px 20px;display:grid;gap:16px;max-width:1100px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.sgrid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--sub);font-size:12px;border-top:0}td input{padding:5px 8px}
.ok{color:var(--ok)}.bad{color:var(--warn)}.mut{color:var(--sub);font-size:12px}
.sw{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;padding:0;border:0}
.sw:checked{background:var(--acc)}.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw:checked::after{left:16px}
.scroll{max-height:420px;overflow:auto}
</style></head><body>
<header><h1>AX 발행 콘솔</h1>
<div class="seg" id="tabs"><button onclick="tab('acct')">계정 연결</button><button onclick="tab('cont')">콘텐츠</button><button class="on" onclick="tab('work')">작업</button><button onclick="tab('inc')">장애 <i id="incn" style="font-style:normal"></i></button><button onclick="tab('br')">브라우저</button><button onclick="tab('auto')">자동 작업</button><button onclick="tab('sch')">예약 목록</button><button onclick="tab('set')">설정</button></div>
<div class="seg" id="accs"></div><span class="who" id="who"></span><button class="gbtn" id="refbtn" onclick="refreshTab(this)" title="지금 보는 화면을 새로 불러옵니다">↻ 새로고침</button><button id="stopbtn" class="gbtn" onclick="toggleStop()">비상 정지</button>
<div class="dd" id="umenu"><button class="gbtn" onclick="ddToggle('umenu',event)">관리자 ▾</button>
 <div class="ddm"><a onclick="changePw()">비밀번호 바꾸기</a><a onclick="logout()" class="bad">로그아웃</a></div></div></header>
<div id="stopbar" hidden style="background:var(--warn);color:#fff;padding:8px 20px;font-size:14px"></div>
<main id="setv" hidden></main>
<main id="schv" hidden></main>
<main id="acctv" hidden></main>
<main id="autov" hidden></main>
<main id="contv" hidden></main>
<main id="incv" hidden></main>
<main id="brv" hidden></main>
<div class="wrap" id="workv">
<nav class="card"><h2>채널</h2><div id="chans"></div></nav>
<section class="card"><div class="top2"><h2 id="listTitle">작업</h2><button class="newbtn" onclick="edit(null)">+ 새 작업</button></div><div id="tasks"></div></section>
<section class="card edit" id="edit"></section>
</div>
<script>
let M,T=[],acc='dept',ch=null,cur=null;
const ST={draft:'초안',scheduled:'예약됨',running:'실행 중',done:'완료',failed:'실패',due:'발행할 차례'};
const RP={'':'한 번','daily':'매일','weekly':'매주'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>s?s.replace('T',' ').slice(0,16):'';
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});if(r.status==401){location.href='/login';throw new Error('로그인이 필요합니다')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'오류');return j}
const A=()=>M.accounts.find(a=>a.id==acc), C=()=>A().channels.find(c=>c.id==ch);
function ddToggle(id,e){e.stopPropagation();const d=$(id),o=d.classList.contains('open');document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));if(!o)d.classList.add('open')}
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open')));
async function logout(){if(!confirm('콘솔에서 로그아웃할까요? 자동 작업은 계속 돕니다.'))return;await api('/api/auth/logout',{});location.href='/login'}
async function changePw(){const o=prompt('지금 비밀번호');if(o===null)return;const n=prompt('새 비밀번호(8자 이상)');if(n===null)return;
  if(prompt('새 비밀번호 확인')!==n){alert('두 비밀번호가 다릅니다');return}
  try{await api('/api/auth/password',{old:o,new:n});alert('비밀번호를 바꿨습니다. 다른 곳의 로그인은 모두 끝났습니다.')}catch(e){alert(e.message)}}
let OS={};
async function loadOS(){OS=await api('/api/orchestrator');const s=OS.stop;$('stopbar').hidden=!s;
  if(s)$('stopbar').textContent=`비상 정지 중 (${fmt(s.at)} · ${s.by}) — ${s.reason}. 발행 작업은 시작하지 않습니다. 돌고 있던 작업은 끝까지 갑니다.`;
  $('stopbtn').textContent=s?'정지 풀기':'비상 정지';$('stopbtn').style.cssText=s?'':'color:var(--warn);border-color:var(--warn)';
  if($('osbox'))drawOS()}
async function toggleStop(){if(OS.stop){if(!confirm('비상 정지를 풀고 자동 발행을 다시 시작할까요?'))return;await api('/api/stop',{on:false})}
  else{const r=prompt('비상 정지 사유(모든 자동 발행이 새로 시작하지 않습니다)','');if(r===null)return;await api('/api/stop',{on:true,reason:r})}loadOS()}
function drawOS(){if(!$('osbox')||!OS.holding)return;$('osbox').innerHTML=`<h2 style="margin:0 0 8px">실행 현황 (오케스트레이터)</h2>
  <div class="mut">실행 중</div>${OS.holding.length?[...new Map(OS.holding.map(h=>[h.pid,h])).values()].map(h=>`<div class="run"><b>${esc(h.job)}</b> · ${fmt(h.since)}부터 · <span class="mut">${esc(OS.holding.filter(x=>x.pid==h.pid).map(x=>x.resource).join(', '))}</span></div>`).join(''):'<div class="run mut">없음</div>'}
  <div class="mut" style="margin-top:6px">기다리는 중</div>${OS.waiting.length?OS.waiting.map(w=>`<div class="run"><b>${esc(w.job)}</b> · ${esc(w.blocked_by)} 비기를 기다림 (${fmt(w.since)}부터)</div>`).join(''):'<div class="run mut">없음</div>'}
  <details style="margin-top:6px"><summary class="mut" style="cursor:pointer">최근 기록</summary><pre>${esc(OS.log.slice().reverse().join('\n'))}</pre></details>`}
async function init(){loadOS();setInterval(loadOS,10000);api('/api/incidents').then(v=>{IV=v;badgeInc()});setInterval(()=>api('/api/incidents').then(v=>{IV.open_errors=v.open_errors;badgeInc()}),60000);M=await api('/api/meta');await getAuto();ch=A().channels[0].id;T=await api('/api/tasks');draw();tab('acct');setInterval(()=>{if(!$('workv').hidden)refresh()},4000)}
async function refresh(){T=await api('/api/tasks');draw(false)}
function draw(full=true){
  document.documentElement.dataset.acc=acc;
  $('accs').innerHTML=M.accounts.map(a=>`<button class="${a.id==acc?'on':''}" onclick="acc='${a.id}';ch=A().channels[0].id;cur=null;draw()">${esc(a.label.split(' ')[0])}</button>`).join('');
  $('who').textContent=A().email;
  $('chans').innerHTML=A().channels.map(c=>{const n=T.filter(t=>t.account==acc&&t.channel==c.id).length;const off=c.status!='연결됨';
    return `<button class="ch ${c.id==ch?'on':''} ${off?'off':''}" onclick="ch='${c.id}';cur=null;draw()"><span>${esc(c.label)}<small>${esc(off?c.status:c.detail||'')}</small></span><span class="n">${n}</span></button>`}).join('');
  $('listTitle').textContent=`${A().label.split(' ')[0]} · ${C().label} 작업`;
  const list=T.filter(t=>t.account==acc&&t.channel==ch);
  $('tasks').innerHTML=list.length?list.map(t=>{const a=C().actions.find(x=>x.key==t.action);
    if(INL==t.id)return inlineTask(t);
    return `<div class="task ${cur&&cur.id==t.id?'on':''}" onclick="edit('${t.id}')"><div><div class="t">${esc(t.title)}</div>
    <div class="m">${esc(a?a.label:t.action||'콘텐츠 자동 발행')} · ${t.schedule?fmt(t.schedule)+' '+RP[t.repeat||'']:'시각 미정'}${t.runs&&t.runs[0]?' · 최근 실행 '+fmt(t.runs[0].at):''}</div></div>
    <span style="display:flex;gap:6px;align-items:start"><span class="st ${t.status}">${ST[t.status]||t.status}</span>${t.status!='running'?`<button class="gbtn" title="여기서 바로 고치기" onclick="event.stopPropagation();INL='${t.id}';draw()">✎</button>`:''}</span></div>`}).join(''):'<div class="empty">아직 작업이 없습니다. 오른쪽에서 수행 내용을 입력하세요.</div>';
  const aj=AU.filter(j=>j.channels.some(c=>c[0]==acc&&c[1]==ch));
  $('tasks').innerHTML+=`<div class="autobox"><h2>자동 작업 (launchd ${aj.length}개)</h2>${aj.length?aj.map(j=>jobHtml(j,acc,ch)).join(''):'<div class="mut">이 채널에 걸린 자동 작업이 없습니다.</div>'}</div>`;
  if(cur){const f=T.find(t=>t.id==cur.id);if(f){cur=f}else{cur=null;full=true}}
  if(full)form();else runs();
}
function edit(id){cur=id?T.find(t=>t.id==id):null;draw()}
function form(){
  const t=cur||{title:'',body:'',action:C().actions[0].key,schedule:'',repeat:''};
  $('edit').innerHTML=`<h2>${cur?'작업 수정':'새 작업'} · ${esc(C().label)}</h2>
  <label>제목</label><input id="f_title" value="${esc(t.title)}" placeholder="예: 10월 진로 숏츠 9편 발행">
  <label>수행 내용</label><textarea id="f_body" placeholder="무엇을 할지, 확인할 점, 참고 링크">${esc(t.body)}</textarea>
  <label>실행 작업</label><select id="f_action" onchange="liveNote()">${C().actions.map(a=>`<option value="${a.key}" ${a.key==t.action?'selected':''}>${esc(a.label)}${a.live?' — 실제 발행':''}</option>`).join('')}</select>
  <div class="live" id="live"></div>
  <div class="row"><div><label>실행 시각</label><input type="datetime-local" id="f_schedule" value="${esc((t.schedule||'').slice(0,16))}"></div>
  <div><label>반복</label><select id="f_repeat">${Object.entries(RP).map(([k,v])=>`<option value="${k}" ${k==(t.repeat||'')?'selected':''}>${v}</option>`).join('')}</select></div></div>
  <div class="btns"><button onclick="save('draft')">저장</button><button class="pri" onclick="save('scheduled')">예약 걸기</button>
  ${cur?`<button onclick="runNow()">지금 실행</button><button class="del" onclick="del()">삭제</button>`:''}</div>
  <div class="msg" id="msg"></div><div class="runs" id="runs"></div>`;
  liveNote();runs();
}
function act(){return C().actions.find(a=>a.key==$('f_action').value)}
function liveNote(){const a=act();$('live').textContent=a&&a.live?`실행하면 ${a.script} 가 돌아 실제로 발행됩니다.`:''}
function runs(){if(!$('runs'))return;const r=(cur&&cur.runs)||[];
  $('runs').innerHTML=cur?`<h2>실행 기록</h2>`+(r.length?r.map(x=>`<div class="run"><b class="${x.code==0?'':'x'}">${x.code==0?'성공':'실패('+x.code+')'}</b> ${fmt(x.at)} ${x.manual?'수동':'예약'}<a onclick="showLog('${esc(x.log)}',this)">기록 보기</a></div>`).join(''):'<div class="empty">아직 실행하지 않았습니다.</div>')+(cur.status=='running'?'<div class="run">실행 중…</div>':''):''}
async function showLog(p,el){const t=await (await fetch('/api/log?p='+encodeURIComponent(p))).text();const pre=document.createElement('pre');pre.textContent=t;el.parentNode.after(pre);el.remove()}
async function save(state){
  const b={account:acc,channel:ch,title:$('f_title').value,body:$('f_body').value,action:$('f_action').value,
    schedule:$('f_schedule').value,repeat:$('f_repeat').value,state};
  if(state=='scheduled'&&act().live&&!confirm(`${C().label} 채널에 예약합니다.\n${fmt(b.schedule)}에 '${act().label}'이(가) 실제로 실행됩니다.`))return;
  try{cur=await api(cur?`/api/tasks/${cur.id}/update`:'/api/tasks',b);T=await api('/api/tasks');draw();$('msg').style.color='var(--ok)';$('msg').textContent=state=='scheduled'?'예약했습니다.':'저장했습니다.'}
  catch(e){$('msg').textContent=e.message}}
async function runNow(){const a=C().actions.find(x=>x.key==cur.action)||{live:true,label:'콘텐츠 자동 발행'};
  if(a.live&&!confirm(`지금 '${a.label}'을(를) 실행합니다. 실제로 발행됩니다.`))return;

async function saveAg(){const b={monthly_token_limit:$('ag_lim').value,planner_accounts:{},budgets:{},incident_enabled:$('inc_auto').checked};
  ['dept','personal'].forEach(a=>b.planner_accounts[a]={enabled:$(`pa_${a}_e`).checked,count:$(`pa_${a}_n`).value,weekday:$(`pa_${a}_w`).value,hour:$(`pa_${a}_h`).value});
  ['planner','incident'].forEach(ag=>b.budgets[ag]={max_tokens:$(`b_${ag}_t`).value,max_tool_calls:$(`b_${ag}_c`).value,max_turns:$(`b_${ag}_r`).value});
  try{drawAg(await api('/api/agents',b));$('agmsg').style.color='var(--ok)';$('agmsg').textContent='저장했습니다.'}catch(e){$('agmsg').style.color='var(--warn)';$('agmsg').textContent=e.message}}
async function loadGw(){drawGw(await api('/api/gateway'))}
function drawGw(g){const r=g.result;
  $('gwcard').innerHTML=`<div class="filt"><h2 style="margin:0 auto 0 0">세명대 AI 게이트웨이</h2><button class="gbtn" onclick="gwCheck(this)">키 연결 확인</button></div>
   <p class="mut">학교 크레딧으로 Claude 를 쓰고, 실패하면 Anthropic 키로 넘어갑니다. 최근 7일 호출: 게이트웨이 ${g.usage7d.gateway}건 · 대비책 전환 ${g.usage7d.fallback}건</p>
   <table><tr><th>모듈</th><th>사용</th><th>기본 키</th><th>추가 키</th><th>모델 바꿈</th></tr>${g.modules.map(m=>`<tr><td>${esc(m.module)}</td><td class="${m.enabled?'ok':'bad'}">${m.enabled?'켜짐':'꺼짐'}</td><td>${esc(m.main_key)}</td><td class="${m.extra_plain?'bad':''}">${m.extra_plain?m.extra_plain+'개 (config.json 평문)':m.extra_store?m.extra_store+'개 (암호화 저장소)':'없음'}</td><td class="mut">${esc(Object.entries(m.model_map).map(([a,b])=>a+' → '+b).join(', '))}</td></tr>`).join('')}</table>
   ${r?`<h2 style="margin-top:14px">키 연결 확인 <span class="mut">${fmt(g.checked)}</span></h2><table>${r.keys.map(k=>`<tr><td>${esc(k.key)}</td><td class="${k.ok?'ok':'bad'}">${esc(k.state)}</td></tr>`).join('')}</table>`:''}`}
async function gwCheck(b){b.disabled=true;b.textContent='확인 중… (키마다 짧은 요청)';try{drawGw(await api('/api/gateway/check',{}))}catch(e){alert(e.message);b.disabled=false}}
function skl(){const q=($('sq').value||'').toLowerCase();$('sk').innerHTML=SV.skills.filter(x=>(x.name+x.desc).toLowerCase().includes(q)).map(x=>`<tr><td style="width:30%">${esc(x.name)}<div class="mut">${esc(x.source)}</div></td><td class="mut">${esc(x.desc)}</td></tr>`).join('')}
async function saveAcc(){const b={accounts:{}};document.querySelectorAll('#setv input[data-a]').forEach(i=>{const a=b.accounts[i.dataset.a]??={channels:{}};
  if(i.dataset.c)(a.channels[i.dataset.c]??={})[i.dataset.k]=i.value;else a[i.dataset.k]=i.value});
  try{await api('/api/settings/accounts',b);M=await api('/api/meta');$('smsg').style.color='var(--ok)';$('smsg').textContent='저장했습니다.'}catch(e){$('smsg').textContent=e.message}}
async function plug(id,el){if(!confirm(`${id.split('@')[0]} 플러그인을 ${el.checked?'켭':'끕'}니다.`)){el.checked=!el.checked;return}
  try{await api('/api/settings/plugin',{id,enabled:el.checked})}catch(e){alert(e.message);el.checked=!el.checked}}
init();
</script></body></html>
