<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>AX 운영 콘솔 — 계정별 채널 운영</title>

<script type="module" src="/web/app.js"></script>
</head>
<body>

<div class="readonly-bar">1단계 · 실제 자료 읽기 전용 · 기획 저장·예약 변경·발행·제어 미지원</div>
<div class="app" id="app-shell">
<aside class="sidebar">
<div class="brand">AX 운영 콘솔<small>계정별 채널 운영</small></div>
<div><div class="nav-label">운영 메뉴</div><nav class="nav" aria-label="주 메뉴">
<button data-route="personal-accounts"><span class="nav-icon" aria-hidden="true">◎</span>개인 계정 연결</button>
<button data-route="dept-accounts"><span class="nav-icon" aria-hidden="true">◎</span>학과 계정 연결</button>
<button data-route="personal-publishing" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span>개인 콘텐츠 발행</button>
<button data-route="dept-publishing"><span class="nav-icon" aria-hidden="true">▦</span>학과 콘텐츠 발행</button>
</nav></div>
<div class="sidebar-bottom"><b>두 계정, 하나의 운영 흐름</b>원본 소유 계정과 실제 게시 대상 채널을 구분합니다.</div>
</aside>
<div class="workspace">
<header class="topbar"><div class="scope-wrap"><span class="account-badge personal" id="account-badge" role="status" aria-live="polite">현재 계정: 개인</span>
<p class="scope-caption">원본 소유권과 게시 대상은 별도로 표시합니다.</p></div>
<div class="top-actions"><button class="btn btn-small" id="refresh">새로고침</button><button class="btn btn-small" disabled title="읽기 전용 단계에서는 발행 제어를 지원하지 않습니다.">발행 제어 미지원</button><span class="meta-copy">정지 상태 별도 확인 필요</span></div>
</header>
<main class="content" id="main-content" tabindex="-1">
<div class="status-area" id="load-status" role="status" aria-live="polite">조회 준비 중</div>
<div id="screen-root" aria-busy="true"></div>
<noscript><p class="empty">실제 조회 화면을 이용하려면 JavaScript를 켜 주세요. 자료 조회는 로그인 후 가능합니다.</p></noscript>
<footer class="footer"><span>AX 운영 콘솔 · 계정별 채널 운영</span><span>로컬 조회 화면 · 한국시간 · 마지막 수집 결과 기준</span></footer>
</main>
</div>
</div>
<dialog class="detail-dialog" id="detail-dialog" aria-labelledby="drawer-title">
<div class="dialog-layout"><div class="drawer-head"><div id="drawer-heading"></div><button class="drawer-close" id="drawer-close" aria-label="상세 패널 닫기">×</button></div><div class="drawer-content" id="drawer-content"></div><div class="drawer-foot"><span>읽기 전용 · 원문 편집 및 배포 변경 미지원</span><button class="btn btn-primary btn-small" disabled title="읽기 전용 단계에서는 예약·발행을 지원하지 않습니다.">예약·발행 미지원</button></div></div>
</dialog>
