prompt = "매일 오전 7시(Asia/Seoul)에 측량및지형공간정보기술사 시험 대비 연습문제 1개와 모범답안을 한국어로 작성하여 https://na-geoai.tistory.com/ 의 ‘재난안전과 GeoAI’ 블로그에 공개 발행하고, 발행한 개별 게시글 링크를 사용자 본인의 카카오톡 나에게 보내기로 전송한다. 사용자는 이 블로그의 매일 자동 발행과 카카오톡 링크 전송을 명시적으로 요청했다. Chrome 브라우저와 cua_repl로 티스토리 관리화면을 사용한다. 로그인·해당 블로그 관리권한을 확인하고, 다른 블로그에 게시하지 않는다. 이 채팅과 블로그의 이전 게시글을 확인해 주제 중복 및 같은 날 이중 발행을 방지하고 일차를 이어간다. 1일차 주제는 타원체고·정표고·지오이드고의 관계와 GNSS 높이측량 적용이며, 수동 실행에서 이미 발행된 경우 다음 주제로 진행한다. 정기 발행은 분야별 고정 순서로 하루 한 문제씩 순차적으로 생성한다. 2일차 온톨로지는 기존 사용자 지정대로 유지한다. 3일차부터 측지학·좌표계 → GNSS → 오차론·망조정 → 지상측량 → 사진측량·UAV → LiDAR·원격탐사 → GIS·공간정보 → 관련 제도·실무 순으로 진행하고, 여덟 분야를 마치면 첫 분야로 돌아가 새 세부 주제를 다룬다. 3일차부터 분야 인덱스는 (일차-3) mod 8로 결정하여 임의로 분야를 건너뛰지 않는다. 각 분야는 순환을 거듭하며 기본 개념·원리에서 비교·오차·절차·실무 적용으로 점진적으로 심화한다. 이전 발행 주제·순환 차수를 확인하여 동일 문제를 반복하지 않는다. 분야와 순환 차수를 문제 바로 위에 표시하며 시험의 공식 과목 구분으로 오해되지 않게 학습용 분야 분류임을 밝힌다. 단답형과 논술형을 번갈아 다루고, 작성시간과 분량은 학습용 권장치로 표시한다. 제목은 ‘[측량및지형공간정보기술사 하루 한 문제] N일차 | 주제’ 형식으로 작성한다. 카테고리는 ‘측량및지형공간정보기술사 시험 대비’를 우선 사용하고 없으면 이 카테고리를 새로 만든다. 글은 문제, 권장 작성시간·분량, 답안 목차, 시험 답안 형식의 완성된 모범답안, 핵심 암기어 3~5개, 자가점검 항목, 공식 참고자료 링크와 태그 5~8개로 구성한다. 정의·원리·공식·비교표·도식·실무 적용·유의사항·결론은 문제 성격에 맞게 포함하고 불필요하게 늘리지 않는다. 직접 만든 문제는 창작 연습문제로 명시하고 실제 기출은 Q-net 등 원문에서 회차·문항을 확인한 경우에만 기출로 표시한다. 공식·단위·가정·부호를 정확히 설명하고 최신 법령·기준·기술은 공식 원문으로 확인한다. 모범답안은 학습용 예시이며 공식 채점기준이라고 표현하지 않는다. 발행 전 편집기에서 제목·본문·수식·표·링크와 중복 여부를 확인하고 발행 후 공개 개별 글 URL에서 제목·본문 표시를 검증한다. 공개 발행 검증 후 PlayMCP의 mcp__codex_apps__playmcp_kakaotalkchat_memochat 도구로 제목과 해당 개별 글 URL을 담은 200자 이내 메시지를 본인의 카카오톡으로 보낸다. 카카오톡 전송만 실패하면 블로그 글을 중복 발행하지 말고 전송 실패와 글 URL을 이 채팅에 보고한다. 로그인이 만료되거나 2단계 인증·캡차·권한 문제로 막히면 원고를 보존하고 필요한 사용자 조치를 알리며 발행·전송 성공을 꾸미지 않는다. 완료 시 이 채팅에 게시글 링크와 카카오톡 전송 결과를 알리고 단순 진행 알림은 반복하지 않는다.\n사용자의 추가 요구사항: 원본 기술사 답안지 양식은 Q-net에서 직접 다운로드한 /Volumes/USB256/기술사/2026기술사 답안지-1교시(안내용)_Qnet원본.pdf 를 사용한다. 새 자료와 완성 답안 PDF, 원고, 그림·표 및 발행 증빙은 모두 /Volumes/USB256/기술사 아래에 저장한다. 매회 PDF 스킬을 사용하여 원본의 실제 답안 작성면에 모범답안을 작성한 별도 PDF를 생성하며, 단순 본문 문서나 양식과 다른 종이에 작성하는 것으로 대체하지 않는다. 원본은 보존한다. 단답형은 약 1~2쪽, 논술형은 약 3쪽을 학습용 권장 분량으로 삼되 문제 범위에 따라 조정한다. 글자 크기를 과도하게 줄여 분량을 맞추지 않고 시험 답안으로 쓸 수 있는 핵심 내용으로 압축한다. 각 문제에 적합한 원리도·흐름도 등 그림과 비교표를 넣고, 그림의 가정·기호·단위와 표의 항목을 명료하게 표시한다. 생성 PDF의 모든 페이지를 렌더링하여 한글·수식·줄맞춤·겹침·잘림을 확인한 뒤 완성 답안 PDF를 티스토리 게시글의 다운로드 가능한 첨부파일로 업로드한다. 첫 게시글에는 원본 빈 양식도 첨부한다. 본문에도 주요 그림·표와 출처 및 참고사이트의 클릭 가능한 원문 링크를 제공한다. 공개 페이지에서 첨부파일 표시·접근 가능 여부를 확인하고 나서 카카오톡으로 개별 게시글 링크를 전송한다. 저장권한이나 업로드가 막히면 원고와 생성 PDF를 보존하고 실제 제한을 알린다.\n명칭은 항상 ‘측량및지형공간정보기술사’로 표기하고 ‘측량기술사’로 줄이지 않는다. 1일차 https://na-geoai.tistory.com/7 공개 발행 완료. 파일 첨부는 티스토리 파일 업로드 메뉴로 생성한 첨부 카드의 data-file-name, data-file-size, data-file-mimetype를 보존한다. 편집기의 파일 figure를 복사하여 재붙여넣기하거나 임시 CDN 주소를 추측하지 않는다. 공개 페이지에서 실제 PDF 다운로드를 검증한다. 도식은 JPEG로 올리면 정상 표시됨을 확인했다.\n모범답안 PDF는 사용자가 출력하여 펜으로 글씨 위를 따라 쓰는 연습용으로 제작한다. 답안 제목·본문·목차·수식·표 안의 글자·도식 기호와 설명 등 작성한 글씨는 옅은 회색 RGB(184,184,184), HEX #B8B8B8 정도로 통일한다. 도식 선도 따라 그리기 좋도록 옅은 회색을 적용한다. 공식 빈 답안지 원본의 선과 인쇄 문구는 보존한다. 본문 블로그 글은 읽기 쉬운 원래 색상을 유지한다. 매회 따라쓰기용 PDF임을 게시글의 첨부 설명과 파일명에 표시한다.\n다음 회차 지정: 사용자가 2026년 10월 8일 온톨로지가 출제됐다고 알려주며 내일 회차에 게시하도록 명시적으로 요청했다. 2026년 10월 9일 오전 7시(Asia/Seoul)에 발행할 2일차 주제는 온톨로지(Ontology)로 정한다. 문제는 온톨로지의 개념·구성요소·공간정보 분야 활용을 중심으로 작성하고, 관계도와 비교표, 공간정보 적용 사례를 포함한다. 해당 측량및지형공간정보기술사 기출 회차·교시·문항·질문 원문을 Q-net 공식 문제지에서 우선 확인한다. 출제 사실이 아직 검증되지 않았으므로 사용자의 전언을 확정된 기출로 표시하지 않는다. 원문을 확인하면 정확한 기출 문항과 회차를 사용하고, 확인하지 못하면 창작 연습문제로 명시하며 출제 회차 미확인을 분명히 한다. 기존 원본 답안지에 옅은 회색 글씨로 작성한 따라쓰기 모범답안 PDF를 생성·검증·첨부하고, 공개 글 검증 후 카카오톡으로 개별 링크를 전송한다. 오늘 추가 글을 발행하지 않고 내일 2일차로 게시한다. 이후에는 기존 주제 순환을 계속한다.\n웹 문제 목록 연동: https://geoai-na.netlify.app/questions/ 에 문제 입력 화면과 발행된 문제 목록을 추가했다. 매일 공개 글과 따라쓰기 PDF를 검증한 뒤 /Volumes/USB256/devAPP/AutoSNS/engineer-question-worker/queue.py add-post --url 개별글URL --title 순수문제제목 --date 한국날짜 --kind daily --day 일차 --tags 분야 --pdf 를 실행하여 공개 목록을 추가·갱신한다. 인자는 subprocess 배열 또는 안전하게 인용하여 전달한다. 이어 같은 디렉터리의 deploy.py를 실행해 기존 Netlify 사이트에 공개 목록을 배포하고 ready 및 목록에서 실제 링크를 확인한다. Netlify 로그인 정보는 로컬 CLI 설정에서만 읽으며 비밀정보·원고·대기열을 공개 폴더에 넣지 않는다. 목록 갱신에 실패하면 이미 공개한 글을 재발행하지 말고 목록 후처리만 복구한다. 친구 요청은 별도 자동화에서 처리